name: Release

# Push a tag such as v0.0.2 to build the installers and publish a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm nsis python3-pil
      - name: Build (version taken from the tag)
        run: ./build.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
